services:

  backend:
    build:
      context: ../backend
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    networks:
      - english-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: english_trainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - english-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - english-network

networks:
  english-network:
    external: true
    name: english-network-test